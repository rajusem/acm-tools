apiVersion: batch/v1
kind: CronJob
metadata:
  name: simple-cpu-workload
  # DO NOT "fix" this literal — it is the sed key + file selector in rs-e2e
  # deploy_namespace_workloads (~line 1088). Deployed name = RS_NS_WORKLOAD_NS.
  namespace: offline-workload
  labels:
    app: simple-cpu
    workload-type: cpu
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 0
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: simple-cpu
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cpu-worker
            image: busybox:latest
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                cpu: "100m"
                # 32Mi keeps the namespace request total at 256Mi — see simple-memory-workload.yaml
                memory: "32Mi"
              limits:
                cpu: "500m"
                memory: "128Mi"
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting CPU workload at $(date)"
              # CPU-intensive loop for 15 minutes
              timeout 900 sh -c 'while true; do
                i=0
                while [ $i -lt 100000 ]; do
                  i=$((i+1))
                done
              done' || true
              echo "CPU workload completed at $(date)"
