apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora-vm-1
  namespace: auto-vm-test
  labels:
    app: fedora-vm-1
    type: fedora
    vm-type: stress-test
spec:
  running: true
  dataVolumeTemplates:
    # containerDisk cannot be used here: virt-handler fails to write VMI status with
    # "Checked value must be of type integer with format int32 in
    #  status.volumeStatus[].containerDiskVolume.checksum", so the VMI never leaves
    # Scheduled even though the guest boots. Observed on CNV 4.22.0 / OCP 5.0.0-ec.6.
    #
    # source.registry (not sourceRef/DataSource) is deliberate:
    #   - keeps the digest pin, so the guest baseline stays deterministic
    #   - avoids serialising behind other clones of the shared golden-image PVC
    #     (measured: 3 concurrent DataSource clones took 140s/157s/294s; two
    #      registry imports finished in under 140s with no queue)
    #   - removes the dependency on golden-image import having completed
    - metadata:
        name: fedora-vm-1-root
      spec:
        source:
          registry:
            url: "docker://quay.io/containerdisks/fedora@sha256:1217dcc8c58dbc3ca08e0323929b86f609506121adb01d0fd892232f2c0544f6"
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        kubevirt.io/vm: fedora-vm-1
        app: fedora-vm-1
        type: fedora
    spec:
      evictionStrategy: None
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 4Gi
            cpu: "2"
          limits:
            memory: 4Gi
            cpu: "2"
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: fedora-vm-1-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              # WARNING: Default password is for testing only. Change before production use!
              user: fedora
              password: password
              chpasswd: { expire: False }
              ssh_pwauth: true
              ssh_authorized_keys:
                - "__RS_VM_SSH_PUBLIC_KEY__"
              packages:
                - stress-ng
                - openssh-server
              runcmd:
                - mkdir -p /var/run/sshd
                - ssh-keygen -A || true
                - nohup /usr/sbin/sshd > /dev/null 2>&1 &
                - sleep 3
                - pgrep -f "/usr/sbin/sshd" && echo "sshd started successfully" || echo "sshd may not be running"
                # 2900M (was 3200M): at 3200M usage hit ~3.80GiB against ~3.83Gi MemTotal — on the
                # OOM edge, passing by luck. 2900M + ~680Mi baseline => 1.1*3580/4096 ~= 0.96 (ideal),
                # with ~310Mi guest headroom. stress-ng is fine here (installs on Fedora).
                - nohup stress-ng --cpu 2 --vm 1 --vm-bytes 2900M --vm-keep -t 0 > /dev/null 2>&1 &
                - sleep 5 && pgrep stress-ng && echo STRESS_NG_RUNNING > /etc/vm_status || echo STRESS_NG_FAILED > /etc/vm_status
---
apiVersion: v1
kind: Service
metadata:
  name: fedora-vm-1-ssh-service
  namespace: auto-vm-test
spec:
  selector:
    app: fedora-vm-1
  ports:
    - protocol: TCP
      port: 2200
      targetPort: 22
  type: NodePort
