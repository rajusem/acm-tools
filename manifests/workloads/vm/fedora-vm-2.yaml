apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora-vm-2
  namespace: auto-vm-test
  labels:
    app: fedora-vm-2
    type: fedora
    vm-type: test
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: fedora-vm-2
        app: fedora-vm-2
        type: fedora
    spec:
      domain:
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 4Gi
            cpu: "2"
          limits:
            memory: 4Gi
            cpu: "2"
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              # WARNING: Default password is for testing only. Change before production use!
              user: fedora
              password: password
              chpasswd: { expire: False }
              ssh_pwauth: true
              ssh_authorized_keys:
                - "__RS_VM_SSH_PUBLIC_KEY__"
              packages:
                - openssh-server
              runcmd:
                - mkdir -p /var/run/sshd
                - ssh-keygen -A || true
                - nohup /usr/sbin/sshd > /dev/null 2>&1 &
                - sleep 3
                - pgrep -f "/usr/sbin/sshd" && echo "sshd started successfully" || echo "sshd may not be running"
                - echo "VM Ready" > /etc/vm_status
