# CPU-underestimation fixture (floor-based dashboard panels).
#
# RS cpu_request = count(kubevirt_vmi_vcpu_seconds_total) = guest vCPU COUNT (not requests.cpu).
# RS cpu_usage   = rate(kubevirt_vmi_cpu_usage_seconds_total); capped at the vCPU count.
# Underestimation panel fires when floor(request - usage*1.1) < 0, i.e. usage > request/1.1.
# With 1 guest vCPU pegged at ~100%: request=1, usage->1.0, reco=1.1 -> floor(1-1.1) = -1.
#
# Determinism notes (validated on vm-spoke Aug 2026, see docs/TROUBLESHOOTING.md):
#   - Exactly ONE guest vCPU (domain.cpu.cores: 1) pegged by a base-image shell busy loop.
#   - NO network package install (dnf) — that was the root cause of prior non-determinism.
#   - Keep memory small / unpressured so the busy loop is not starved of CPU cycles
#     (memory pressure steals cycles and drops guest cpu usage below the 90.9% threshold).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cpu-underest-vm
  namespace: auto-vm-test
  labels:
    app: cpu-underest-vm
    type: fedora
    vm-type: stress-test
spec:
  running: true
  dataVolumeTemplates:
    # containerDisk cannot be used here: virt-handler fails to write VMI status with
    # "Checked value must be of type integer with format int32 in
    #  status.volumeStatus[].containerDiskVolume.checksum", so the VMI never leaves
    # Scheduled even though the guest boots. Observed on CNV 4.22.0 / OCP 5.0.0-ec.6.
    #
    # source.registry (not sourceRef/DataSource) is deliberate:
    #   - keeps the digest pin, so the guest baseline stays deterministic
    #   - avoids serialising behind other clones of the shared golden-image PVC
    #     (measured: 3 concurrent DataSource clones took 140s/157s/294s; two
    #      registry imports finished in under 140s with no queue)
    #   - removes the dependency on golden-image import having completed
    - metadata:
        name: cpu-underest-vm-root
      spec:
        source:
          registry:
            # Digest pin (do not switch to a :latest tag or a DataSource): the
            # underestimation window depends on the guest baseline RAM/CPU footprint,
            # which a moving tag can shift out from under the fixture. This digest is
            # Fedora 44 (quay.io/containerdisks/fedora:latest as of 2026-08-25).
            # Re-validate the load math if you bump it.
            url: "docker://quay.io/containerdisks/fedora@sha256:1217dcc8c58dbc3ca08e0323929b86f609506121adb01d0fd892232f2c0544f6"
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        kubevirt.io/vm: cpu-underest-vm
        app: cpu-underest-vm
        type: fedora
    spec:
      evictionStrategy: None
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 2Gi
            cpu: "1"
          limits:
            memory: 2Gi
            cpu: "2"
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: cpu-underest-vm-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              password: fedora
              chpasswd: { expire: False }
              runcmd:
                # Peg the single guest vCPU with a base-image shell busy loop (no network).
                - nohup sh -c 'while :; do :; done' >/dev/null 2>&1 &
                - sleep 5 && pgrep -f 'while' >/dev/null && echo CPU_LOAD_RUNNING > /etc/vm_status || echo CPU_LOAD_FAILED > /etc/vm_status
